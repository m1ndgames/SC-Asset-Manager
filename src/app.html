<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sc-assetmanager.org/" />

    <!-- Primary meta -->
    <title>Star Citizen Asset Manager</title>
    <meta name="description" content="Free browser-based commodity tracker for Star Citizen. Log assets, record trades, track P&L, push orders to UEX Corp, and sync with your org in real time." />
    <meta name="keywords" content="Star Citizen, commodity tracker, asset manager, trade tracker, trade log, UEX Corp, aUEC, SC-AssetManager" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sc-assetmanager.org/" />
    <meta property="og:title" content="Star Citizen Asset Manager" />
    <meta property="og:description" content="Free browser-based commodity tracker for Star Citizen. Log assets, record trades, track P&L, push orders to UEX Corp, and sync with your org in real time." />
    <meta property="og:site_name" content="SC-AssetManager" />
    <meta property="og:image" content="https://sc-assetmanager.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Star Citizen Asset Manager" />
    <meta name="twitter:description" content="Free browser-based commodity tracker for Star Citizen. Log assets, record trades, track P&L, push orders to UEX Corp, and sync with your org in real time." />
    <meta name="twitter:image" content="https://sc-assetmanager.org/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Star Citizen Asset Manager",
      "url": "https://sc-assetmanager.org",
      "description": "Free browser-based commodity tracker for Star Citizen. Log assets, record trades, track P&L, push orders to UEX Corp, and sync with your org in real time.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
